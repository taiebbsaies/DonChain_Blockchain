[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/"]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 50
[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }

[lint]
# block.timestamp n'est utilisé que pour des délais de l'ordre du jour (§9.2)
exclude_lints = ["block-timestamp"]
