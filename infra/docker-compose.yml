services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: donchain
      POSTGRES_PASSWORD: donchain
      POSTGRES_DB: donchain
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U donchain"]
      interval: 5s
      retries: 10
volumes:
  dbdata:
