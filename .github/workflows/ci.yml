# Intégration continue DonChain (§13) : contrats, analyse statique, API et web à chaque push.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: default

jobs:
  contracts:
    name: Contrats (fmt, build, tests, couverture)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
      - run: forge fmt --check
      - name: Build (avec contrôle de la taille EIP-170)
        run: forge build --sizes
      - run: forge test -vv
      - name: Couverture (seuil 90 % des lignes)
        run: |
          forge coverage --report summary --no-match-coverage "test|script" | tee coverage.txt
          pct=$(grep '^| Total' coverage.txt | awk -F'|' '{print $3}' | grep -oE '[0-9]+\.[0-9]+' | head -1)
          echo "Couverture des lignes : $pct %"
          awk -v p="$pct" 'BEGIN { exit (p >= 90) ? 0 : 1 }'

  slither:
    name: Analyse statique (Slither)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crytic/slither-action@v0.4.1
        with:
          target: contracts
          slither-args: --filter-paths "lib/|test/|script/" --exclude timestamp,naming-convention
          fail-on: high

  api-web:
    name: API et web (lint, tests, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: donchain
          POSTGRES_PASSWORD: donchain
          POSTGRES_DB: donchain_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U donchain" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chaîne locale et données de démonstration
        run: |
          anvil > anvil.log 2>&1 &
          sleep 2
          pnpm chain:seed
      - name: API
        working-directory: apps/api
        env:
          TEST_DATABASE_URL: postgres://donchain:donchain@127.0.0.1:5432/donchain_test
        run: |
          pnpm lint
          pnpm test
          pnpm test:e2e
          pnpm build
      - name: Web
        working-directory: apps/web
        run: |
          pnpm lint
          pnpm build
          pnpm typecheck
